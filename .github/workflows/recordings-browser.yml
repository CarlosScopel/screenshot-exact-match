name: Private recordings browser validation
on:
  push:
    branches: ['qa/private-recordings-20261112']
    paths: ['.github/workflows/recordings-browser.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Isolated tooling and harmless video fixture
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          mkdir -p qa-reports
          ffmpeg -f lavfi -i color=c=0x101827:s=640x360:d=5 -c:v libvpx -b:v 120k -an qa-fixture.webm -loglevel error
      - name: Actual component and video playback with isolated backend responses
        run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          node --env-file=.env --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {pathToFileURL} from 'node:url';
          import {createServer} from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwind from '@tailwindcss/vite';
          import path from 'node:path';
          const {chromium}=await import(pathToFileURL(process.env.PLAYWRIGHT_PATH).href);
          const uid='00000000-0000-4000-8000-000000000002',id='00000000-0000-4000-8000-000000000101';
          const fixture=await readFile('qa-fixture.webm');
          const base=process.env.VITE_SUPABASE_URL.replace(/\/+$/,'');
          try {const r=await fetch(base+'/storage/v1/upload/resumable',{method:'OPTIONS',headers:{apikey:process.env.VITE_SUPABASE_PUBLISHABLE_KEY}});await writeFile('qa-reports/storage-capabilities.json',JSON.stringify({status:r.status,tusVersion:r.headers.get('tus-version'),maxSize:r.headers.get('tus-max-size')},null,2));}catch(e){await writeFile('qa-reports/storage-capabilities.json',JSON.stringify({error:String(e)}));}
          await writeFile('qa-recordings.html','<html lang="pt-BR"><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="root"></div><script type="module" src="/qa-recordings.tsx"></script></body></html>');
          await writeFile('qa-recordings.tsx',`import {createRoot} from 'react-dom/client';import {RecordingsPanel} from './src/components/portal/RecordingsPanel';import {supabase} from './src/integrations/supabase/client';import './src/styles.css';supabase.auth.getSession=async()=>({data:{session:{access_token:'qa-session'}},error:null}) as never;createRoot(document.getElementById('root')!).render(<main className="min-h-screen p-4 sm:p-8 max-w-5xl mx-auto"><RecordingsPanel userId="${uid}" admin={new URLSearchParams(location.search).has('admin')}/></main>);`);
          const server=await createServer({configFile:false,root:process.cwd(),plugins:[react(),tailwind()],resolve:{alias:{'@':path.resolve('src')}},server:{host:'127.0.0.1',port:4179}});await server.listen();
          const browser=await chromium.launch({headless:true});const errors=[],results=[];
          try{
            for(const [name,width,height] of [['desktop',1440,1080],['mobile',390,844]]){
              const recordings=[{id,user_id:uid,title:'Call semanal — estratégias e próximos passos',description:'Gravação demonstrativa para testar o player.',recorded_on:'2026-11-12',file_path:uid+'/'+id+'/recording.webm',file_name:'qa-fixture.webm',mime_type:'video/webm',size_bytes:fixture.length,status:'published',created_at:'2026-11-12T00:00:00Z'}];
              const learning={content:'Minhas anotações da call.',revision:0,position_seconds:1};let received=0,uploaded=false,saved=false;
              const page=await browser.newPage({viewport:{width,height}});page.on('pageerror',error=>errors.push(String(error)));
              const cors={'access-control-allow-origin':'*','access-control-allow-headers':'*','access-control-allow-methods':'GET,POST,HEAD,PATCH,OPTIONS','access-control-expose-headers':'Location,Upload-Offset,Tus-Resumable'};
              await page.route('**/*',async route=>{
                const req=route.request(),url=new URL(req.url()),method=req.method();if(url.hostname==='127.0.0.1')return route.continue();
                if(method==='OPTIONS')return route.fulfill({status:204,headers:cors});
                const rpc=url.pathname.split('/rpc/')[1];
                if(rpc){const arg=req.postDataJSON();let data=null;
                  if(rpc==='recordings_list'){if(arg.p_user_id!==uid)throw Error('wrong recipient');data=recordings;}
                  else if(rpc==='recordings_create'){const created={...recordings[0],id:'00000000-0000-4000-8000-000000000102',title:arg.p_title,description:arg.p_description,file_name:arg.p_file_name,size_bytes:arg.p_size_bytes,mime_type:arg.p_mime_type,status:'uploading'};created.file_path=uid+'/'+created.id+'/recording.webm';recordings.push(created);data=created;}
                  else if(rpc==='recordings_publish'){if(!uploaded)throw Error('published before complete upload');recordings[1].status='published';data=recordings[1];}
                  else if(rpc==='recordings_learning')data=learning;
                  else if(rpc==='recordings_save_note'){if(arg.p_id!==id||arg.p_revision!==learning.revision)throw Error('wrong note target');learning.content=arg.p_content;learning.revision++;saved=true;data=learning;}
                  else if(rpc==='recordings_save_position'){learning.position_seconds=arg.p_seconds;}
                  else throw Error('unexpected RPC '+rpc);
                  return route.fulfill({json:data,headers:cors});
                }
                if(url.pathname.endsWith('/upload/resumable')&&method==='POST')return route.fulfill({status:201,headers:{...cors,Location:base+'/storage/v1/upload/resumable/qa-id'}});
                if(url.pathname.endsWith('/upload/resumable/qa-id')&&method==='HEAD')return route.fulfill({status:200,headers:{...cors,'Upload-Offset':String(received)}});
                if(url.pathname.endsWith('/upload/resumable/qa-id')&&method==='PATCH'){if(Number(req.headers()['upload-offset'])!==received)throw Error('wrong upload offset');received+=req.postDataBuffer().length;uploaded=received===fixture.length;return route.fulfill({status:204,headers:{...cors,'Upload-Offset':String(received)}});}
                if(url.pathname.includes('/object/sign/')&&method==='POST')return route.fulfill({json:{signedURL:'/object/sign/mentorship-recordings/qa-fixture.webm?token=qa'},headers:cors});
                if(url.pathname.includes('/object/sign/')&&method==='GET'){
                  const range=req.headers()['range'];if(range){const match=/bytes=(\d+)-(\d*)/.exec(range);const start=Number(match[1]),end=match[2]?Math.min(Number(match[2]),fixture.length-1):fixture.length-1;return route.fulfill({status:206,body:fixture.subarray(start,end+1),headers:{...cors,'Content-Type':'video/webm','Accept-Ranges':'bytes','Content-Range':`bytes ${start}-${end}/${fixture.length}`}});}
                  return route.fulfill({body:fixture,contentType:'video/webm',headers:cors});
                }
                return route.abort();
              });
              await page.goto('http://127.0.0.1:4179/qa-recordings.html?admin');
              await page.getByLabel('Título da gravação',{exact:true}).fill('Call enviada no teste');
              await page.getByLabel('Arquivo da call (MP4 ou WebM)',{exact:true}).setInputFiles('qa-fixture.webm');
              await page.getByRole('button',{name:'Enviar gravação',exact:true}).click();
              await page.getByText('Gravação publicada no espaço exclusivo do mentorado.',{exact:true}).waitFor();
              if(!uploaded||recordings[1].status!=='published')throw Error('upload failed');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1))throw Error(name+' admin overflow');
              await page.screenshot({path:`qa-reports/${name}-admin.png`,fullPage:true});
              await page.goto('http://127.0.0.1:4179/qa-recordings.html');
              await page.getByRole('button',{name:'Assistir gravação',exact:true}).first().click();
              await page.waitForFunction(()=>{const v=document.querySelector('video');return v&&v.readyState>=2&&v.duration>0;});
              await page.locator('video').evaluate(async v=>{await v.play();});
              await page.waitForFunction(()=>document.querySelector('video').currentTime>1.2);
              await page.locator('video').evaluate(v=>v.pause());
              await page.getByRole('combobox',{name:/Velocidade/}).selectOption('1.5');
              await page.getByLabel('Minhas anotações privadas',{exact:true}).fill('Plano da próxima call: executar as tarefas.');
              await page.getByRole('button',{name:'Salvar anotações',exact:true}).click();
              await page.getByText('Anotações salvas.',{exact:true}).waitFor();
              if(!saved||await page.getByRole('button',{name:'Enviar gravação',exact:true}).count())throw Error('student access problem');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1))throw Error(name+' student overflow');
              await page.screenshot({path:`qa-reports/${name}-student.png`,fullPage:true});
              await page.reload();await page.getByRole('button',{name:'Assistir gravação',exact:true}).first().click();
              await page.waitForFunction(()=>document.querySelector('textarea')?.value==='Plano da próxima call: executar as tarefas.');
              results.push({viewport:name,adminUpload:true,videoDecodedAndPlayed:true,speedControl:true,noteSavedAndReloaded:true,studentCannotUpload:true,noHorizontalOverflow:true});await page.close();
            }
            if(errors.length)throw Error(errors.join('\n'));
          }finally{await writeFile('qa-reports/browser.json',JSON.stringify({results,errors,backend:'intercepted fictitious RPCs and local generated video; no production files accessed'},null,2));await browser.close();await server.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings-browser-evidence
          path: qa-reports/
          retention-days: 7
