name: Verify A ORDEM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Prepare evidence directory
        if: always()
        run: mkdir -p qa-reports
      - name: TypeScript
        if: always() && steps.install.outcome == 'success'
        run: bunx --no-install tsc --noEmit 2>&1 | tee qa-reports/typescript.log
      - name: Unit tests
        if: always() && steps.install.outcome == 'success'
        run: bun run test --reporter=default --reporter=json --outputFile=qa-reports/vitest.json
      - name: Production build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: bun run build 2>&1 | tee qa-reports/build.log
      - name: Browser validation tooling (isolated from app dependencies)
        id: browser-tooling
        if: always() && steps.build.outcome == 'success'
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-browser" --no-save --package-lock=false playwright wrangler
          node "$RUNNER_TEMP/portal-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile checks on Cloudflare runtime
        if: always() && steps.browser-tooling.outcome == 'success'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --env-file=.env --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".output/server/.dev.vars",`SUPABASE_URL=${JSON.stringify(process.env.VITE_SUPABASE_URL)}\nSUPABASE_PUBLISHABLE_KEY=${JSON.stringify(process.env.VITE_SUPABASE_PUBLISHABLE_KEY)}\n`);'
          node "$RUNNER_TEMP/portal-browser/node_modules/wrangler/bin/wrangler.js" dev --config .output/server/wrangler.json --local --ip 127.0.0.1 --port 4173 > qa-reports/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/portal-browser/node_modules/playwright/index.mjs" node --env-file=.env scripts/validate-browser.mjs
      - name: Lint report (formatting kept separate in evidence)
        if: always() && steps.install.outcome == 'success'
        run: |
          status=0
          bunx --no-install eslint . --format json --output-file qa-reports/lint.json || status=$?
          node --input-type=module -e 'import fs from "node:fs"; const rows=JSON.parse(fs.readFileSync("qa-reports/lint.json","utf8")); const messages=rows.flatMap(r=>r.messages.map(m=>({file:r.filePath.replace(process.cwd()+"/",""),line:m.line,rule:m.ruleId,message:m.message,severity:m.severity}))); const formatting=messages.filter(m=>m.rule==="prettier/prettier"); const other=messages.filter(m=>m.rule!=="prettier/prettier"); const summary={formattingErrors:formatting.length,other}; fs.writeFileSync("qa-reports/lint-summary.json",JSON.stringify(summary,null,2)); console.log(JSON.stringify(summary,null,2));'
          exit "$status"
      - name: Preserve inspected source snapshot (no environment or credentials)
        if: always()
        run: git archive --format=tar.gz --output=qa-reports/source-snapshot.tar.gz HEAD src scripts package.json bun.lock tsconfig.json vite.config.ts vitest.config.ts eslint.config.js AGENTS.md
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: qa-reports/
          retention-days: 7
