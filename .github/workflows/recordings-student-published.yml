name: Verify published learner recordings UI
on:
  push:
    branches: ['qa/recordings-student-experience-20261112']
    paths: ['.github/workflows/recordings-student-published.yml']
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public assets without signing in or changing account data
        run: |
          mkdir -p qa-published
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const base='https://pixel-perfect-replay-54723.lovable.app';
          const required=['ACOMPANHAMENTO INDIVIDUAL','Seus encontros','Do primeiro ao mais recente.','Velocidade de reprodução','Navegação entre encontros','Continue sua sequência','Anotações do encontro'];
          let result;
          for(let attempt=1;attempt<=18;attempt++){
            const response=await fetch(base+'/?recordings-ui-qa='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
            if(!response.ok)throw Error('Public page HTTP '+response.status);
            const html=await response.text();
            const queued=[...html.matchAll(/(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']/g)].map(m=>new URL(m[1],base).href);
            const seen=new Set(),assets=[],text=[];
            while(queued.length&&seen.size<120){
              const next=queued.shift();if(seen.has(next))continue;
              const target=new URL(next);if(target.origin!==base||!target.pathname.startsWith('/assets/'))continue;
              seen.add(next);const asset=await fetch(next);if(!asset.ok)continue;
              const code=await asset.text();text.push(code.replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16))));
              assets.push({path:target.pathname,sha256:createHash('sha256').update(code).digest('hex')});
              for(const match of code.matchAll(/["']((?:\.\/|\/assets\/)?[A-Za-z0-9_./-]+\.js)["']/g))queued.push(new URL(match[1],next).href);
            }
            const joined=text.join('\n'),checks=Object.fromEntries(required.map(marker=>[marker,joined.includes(marker)]));
            result={url:base,expectedCommit:'6efd12880a1781db0b7247cf045912a5304d0e32',attempt,checks,assets,confirmed:Object.values(checks).every(Boolean),scope:'public JS assets only; no learner account accessed'};
            console.log(JSON.stringify({attempt,checks,assetCount:assets.length}));
            if(result.confirmed)break;
            await new Promise(resolve=>setTimeout(resolve,8000));
          }
          await writeFile('qa-published/publication.json',JSON.stringify(result,null,2));
          if(!result.confirmed)throw Error('New student UI not yet observed on the public deployment');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings-student-ui-publication
          path: qa-published/
          retention-days: 7
