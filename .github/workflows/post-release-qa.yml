name: Confirm published launch corrections
on:
  push:
    branches: ['qa/ordem-release-check-20261111']
    paths: ['.github/workflows/post-release-qa.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  published:
    if: github.ref == 'refs/heads/qa/ordem-release-check-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QA_BASE_URL: https://pixel-perfect-replay-54723.lovable.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Reproduce the already-tested release assets
        run: |
          mkdir -p qa-reports
          bun install --frozen-lockfile
          bun run build > qa-reports/reproduced-build.log 2>&1
      - name: Isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-browser" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/portal-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare the published JavaScript byte-for-byte with the corrected build
        run: |
          node --input-type=module <<'JS'
          import { writeFile, readFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const report = { target:process.env.QA_BASE_URL, inspected_revision:'49934fc5bb17269eee27327f6445f601d4ff7ca3', publishedBuildMatches:false, checked_at:new Date().toISOString(), assets:[] };
          try {
            const names = (await readdir('.output/public/assets')).filter(name => name.endsWith('.js'));
            if (!names.length) throw new Error('No built JavaScript assets to verify.');
            for (const name of names) {
              const expected = await readFile(`.output/public/assets/${name}`);
              const response = await fetch(`${process.env.QA_BASE_URL}/assets/${name}`,{signal:AbortSignal.timeout(30000),headers:{'cache-control':'no-cache'}});
              const actual = Buffer.from(await response.arrayBuffer());
              const expectedHash=createHash('sha256').update(expected).digest('hex');
              const actualHash=createHash('sha256').update(actual).digest('hex');
              report.assets.push({path:`/assets/${name}`,status:response.status,expectedHash,actualHash,match:response.ok&&expectedHash===actualHash});
            }
            report.publishedBuildMatches=report.assets.every(asset => asset.match);
            if (!report.publishedBuildMatches) throw new Error('Published assets do not match the verified release; publication is not confirmed.');
          } catch (error) { report.error=String(error); process.exitCode=1; }
          finally { await writeFile('qa-reports/published-version.json',JSON.stringify(report,null,2)); }
          JS
      - name: Desktop and mobile public demonstration without production data changes
        run: |
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/portal-browser/node_modules/playwright/index.mjs" node --env-file=.env scripts/validate-browser.mjs
      - name: Request one owner verification email; prior runs never reached this step
        if: github.run_attempt == 1 && github.run_number == 3
        run: |
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/portal-browser/node_modules/playwright/index.mjs" node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url';
          import { writeFile } from 'node:fs/promises';
          const { chromium } = await import(pathToFileURL(process.env.PLAYWRIGHT_MODULE_PATH).href);
          const browser = await chromium.launch({headless:true});
          const report = { target:process.env.QA_BASE_URL, submitted:false, accepted:false, mailbox_delivery:'not_verified', owner_session_created:false, role_granted_by_test:false };
          try {
            const page = await browser.newPage();
            page.setDefaultTimeout(30000);
            await page.goto(process.env.QA_BASE_URL,{waitUntil:'domcontentloaded'});
            await page.getByRole('button',{name:'Ativar acesso de administrador',exact:true}).click();
            await page.getByLabel('Seu nome',{exact:true}).fill('Carlos Scopel');
            await page.getByLabel('E-mail',{exact:true}).fill('dudu.escopelcarlos253@gmail.com');
            await page.getByRole('button',{name:'Enviar link de administrador',exact:true}).click();
            report.submitted=true;
            const status = page.getByRole('status');
            await status.waitFor();
            report.feedback=await status.innerText();
            report.accepted=report.feedback.includes('Link enviado ao e-mail autorizado');
            if (!report.accepted) throw new Error(report.feedback);
          } catch(error) { report.error=String(error); process.exitCode=1; }
          finally { await writeFile('qa-reports/owner-email-request.json',JSON.stringify(report,null,2)); await browser.close(); }
          JS
      - name: Preserve public validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-release-evidence
          path: qa-reports/
          retention-days: 7
