name: Validate private lesson file preview
on:
  push:
    branches: ['qa/lesson-file-preview-20261112']
    paths: ['.github/workflows/file-preview-qa.yml', 'qa-integrate-file-preview.py', 'src/lib/material-preview.ts', 'src/components/portal/LessonFiles.tsx', 'src/test/lesson-files.test.tsx', 'src/test/lesson-file-page.test.tsx']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply only reviewed lesson integration
        run: |
          mkdir -p qa-reports
          python3 qa-integrate-file-preview.py
          bun install --frozen-lockfile
          bunx --no-install prettier --write src/lib/material-preview.ts src/components/portal/LessonFiles.tsx src/components/portal/Portal.tsx src/test/lesson-files.test.tsx src/test/lesson-file-page.test.tsx
      - name: TypeScript
        run: bunx --no-install tsc --noEmit 2>&1 | tee qa-reports/typescript.log
      - name: All unit and component tests
        run: bun run test --reporter=default --reporter=json --outputFile=qa-reports/vitest.json 2>&1 | tee qa-reports/tests.log
      - name: Lint changed files
        run: bunx --no-install eslint src/lib/material-preview.ts src/components/portal/LessonFiles.tsx src/components/portal/Portal.tsx src/test/lesson-files.test.tsx src/test/lesson-file-page.test.tsx 2>&1 | tee qa-reports/lint.log
      - name: Production build
        run: bun run build 2>&1 | tee qa-reports/build.log
      - name: Preserve exact tested source on QA branch only
        run: |
          git add src/lib/material-preview.ts src/components/portal/LessonFiles.tsx src/components/portal/Portal.tsx src/test/lesson-files.test.tsx src/test/lesson-file-page.test.tsx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: preserve validated private lesson file viewer [skip ci]'
          git push origin HEAD:qa/lesson-file-preview-20261112
          git ls-tree HEAD src/lib/material-preview.ts src/components/portal/LessonFiles.tsx src/components/portal/Portal.tsx src/test/lesson-files.test.tsx src/test/lesson-file-page.test.tsx > qa-reports/tested-files.txt
          git archive --format=tar.gz --output=qa-reports/tested-source.tar.gz HEAD src/lib/material-preview.ts src/components/portal/LessonFiles.tsx src/components/portal/Portal.tsx src/test/lesson-files.test.tsx src/test/lesson-file-page.test.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-file-preview-evidence
          path: qa-reports/
          retention-days: 7
