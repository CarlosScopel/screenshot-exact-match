name: Validate private call recordings
on:
  push:
    branches: ['qa/private-recordings-20261112']
    paths: ['.github/workflows/recordings-qa.yml','qa-integrate-recordings.py','src/lib/recordings*','src/components/portal/RecordingsPanel.tsx','src/test/recordings*','scripts/*recordings.sql']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: ordem_recordings_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_test_only
      PGDATABASE: ordem_recordings_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Integrate only the inspected access points
        id: prepare
        run: |
          mkdir -p qa-reports
          python3 qa-integrate-recordings.py
          bun install --frozen-lockfile
          bunx --no-install prettier --write src/lib/recordings*.ts src/components/portal/RecordingsPanel.tsx src/components/portal/AdminPage.tsx src/components/portal/Portal.tsx src/test/recordings*.ts* src/test/mentee-detail.test.tsx
      - name: Private recordings database policy tests
        run: psql -v ON_ERROR_STOP=1 -f scripts/validate-recordings.sql 2>&1 | tee qa-reports/sql.log
      - name: TypeScript
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bunx --no-install tsc --noEmit 2>&1 | tee qa-reports/typescript.log
      - name: All unit and component tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun run test --reporter=default --reporter=json --outputFile=qa-reports/vitest.json 2>&1 | tee qa-reports/tests.log
      - name: Lint changed files
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bunx --no-install eslint src/lib/recordings*.ts src/components/portal/RecordingsPanel.tsx src/components/portal/AdminPage.tsx src/components/portal/Portal.tsx src/test/recordings*.ts* src/test/mentee-detail.test.tsx 2>&1 | tee qa-reports/lint.log
      - name: Production build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun run build 2>&1 | tee qa-reports/build.log
      - name: Preserve exact tested source on QA branch only
        run: |
          files=(scripts/setup-mentorship-recordings.sql scripts/validate-recordings.sql src/lib/recordings*.ts src/components/portal/RecordingsPanel.tsx src/components/portal/AdminPage.tsx src/components/portal/Portal.tsx src/test/recordings*.ts* src/test/mentee-detail.test.tsx)
          git diff --stat -- "${files[@]}" > qa-reports/diff-stat.txt
          git add "${files[@]}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: preserve validated private call recordings [skip ci]'
          git push origin HEAD:qa/private-recordings-20261112
          git rev-parse HEAD > qa-reports/tested-commit.txt
          git ls-tree HEAD "${files[@]}" > qa-reports/tested-files.txt
          git archive --format=tar.gz --output=qa-reports/tested-source.tar.gz HEAD "${files[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-recordings-evidence
          path: qa-reports/
          retention-days: 7
