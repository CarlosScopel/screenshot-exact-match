name: Verify published mentorship functionality
on:
  push:
    branches: ['qa/mentorship-plans-20261112']
    paths: ['.github/workflows/mentorship-published.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated read-only browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Confirm release markers in publicly served application assets
        env:
          PUBLIC_URL: https://pixel-perfect-replay-54723.lovable.app
        run: |
          mkdir -p qa-reports
          PLAYWRIGHT_PATH="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" node --input-type=module <<'JS'
          import {pathToFileURL} from 'node:url';
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const {chromium}=await import(pathToFileURL(process.env.PLAYWRIGHT_PATH).href);
          const browser=await chromium.launch({headless:true});
          const report={target:process.env.PUBLIC_URL,expected_commit:'ebb802ecd5e6dc74dce77cb9d925f6012f291529',no_authenticated_session:true,no_private_files_accessed:true,no_production_data_changes:true,checks:{},assets:[],checked_at:new Date().toISOString()};
          try{
            const page=await browser.newPage();
            for(let attempt=1;attempt<=6;attempt++){
              await page.goto(process.env.PUBLIC_URL+'/?verify=mentorship-'+Date.now(),{waitUntil:'networkidle',timeout:60000});
              await page.getByRole('button',{name:'Entrar na plataforma',exact:true}).waitFor({timeout:30000});
              const urls=await page.evaluate(()=>[...new Set([...document.querySelectorAll('script[src],link[rel="modulepreload"]')].map(el=>el.src||el.href).concat(performance.getEntriesByType('resource').map(entry=>entry.name).filter(url=>/\.js(?:\?|$)/.test(url))))]);
              let code='';report.assets=[];
              for(const url of urls){const parsed=new URL(url);if(parsed.origin!==new URL(process.env.PUBLIC_URL).origin)continue;const response=await page.request.get(url);if(!response.ok())continue;const text=await response.text();code+='\n'+text;report.assets.push({path:parsed.pathname,sha256:createHash('sha256').update(text).digest('hex')});}
              report.checks={student_navigation:code.includes('Meu plano e pagamentos'),plan_rpc:code.includes('mentorship_save_plan'),account_rpc:code.includes('mentorship_account'),receipt_rpc:code.includes('mentorship_register_receipt'),review_rpc:code.includes('mentorship_review_receipt'),private_bucket:code.includes('payment-receipts'),admin_pricing_form:code.includes('Valor total cobrado')};
              report.attempts=attempt;
              if(Object.values(report.checks).every(Boolean))break;
              if(attempt<6)await new Promise(resolve=>setTimeout(resolve,10000));
            }
            if(!Object.values(report.checks).every(Boolean))throw new Error('Published assets do not yet contain all tested mentorship functions.');
            await page.screenshot({path:'qa-reports/published-login.png',fullPage:true});
          }catch(error){report.error=String(error);process.exitCode=1;}finally{await writeFile('qa-reports/published-mentorship.json',JSON.stringify(report,null,2));await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mentorship-published-evidence
          path: qa-reports/
          retention-days: 7
