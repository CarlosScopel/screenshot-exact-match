name: Validate lesson materials fix
on:
  push:
    branches: ['qa/materials-upload-20261112']
    paths: ['.github/workflows/materials-qa.yml', 'qa-materials.patch', 'src/test/lesson-materials.test.tsx']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Verify inspected source and install locked dependencies
        run: |
          test "$(git hash-object src/components/portal/AdminPage.tsx)" = '41e81d6badc8bedd7f46b719980850d3619c8b18'
          mkdir -p qa-reports
          sed -i 's/name: "Módulos", exact: true/name: "Módulos"/' src/test/lesson-materials.test.tsx
          bun install --frozen-lockfile
      - name: Reproduce empty selector before correction
        run: |
          set +e
          bun run test src/test/lesson-materials.test.tsx -t 'desativa a seleção vazia' --reporter=default --reporter=json --outputFile=qa-reports/baseline.json > qa-reports/baseline.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("qa-reports/baseline.json","utf8")); if(r.numFailedTests!==1) throw new Error("Expected the empty-module regression to fail once");'
      - name: Apply localized correction and format changed files only
        run: |
          git apply --check qa-materials.patch
          git apply qa-materials.patch
          bunx --no-install prettier --write src/components/portal/AdminPage.tsx src/test/lesson-materials.test.tsx
      - name: TypeScript
        run: bunx --no-install tsc --noEmit 2>&1 | tee qa-reports/typescript.log
      - name: All unit and component tests
        run: bun run test --reporter=default --reporter=json --outputFile=qa-reports/vitest.json 2>&1 | tee qa-reports/tests.log
      - name: Lint
        run: bun run lint 2>&1 | tee qa-reports/lint.log
      - name: Production build
        run: bun run build 2>&1 | tee qa-reports/build.log
      - name: Preserve tested files on QA branch only
        run: |
          git diff -- src/components/portal/AdminPage.tsx src/test/lesson-materials.test.tsx > qa-reports/tested.diff
          git add src/components/portal/AdminPage.tsx src/test/lesson-materials.test.tsx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: tested empty lesson selection and materials upload flow [skip ci]'
          git push origin HEAD:qa/materials-upload-20261112
          git rev-parse HEAD > qa-reports/tested-commit.txt
          git ls-tree HEAD src/components/portal/AdminPage.tsx src/test/lesson-materials.test.tsx > qa-reports/tested-files.txt
          git archive --format=tar.gz --output=qa-reports/tested-files.tar.gz HEAD src/components/portal/AdminPage.tsx src/test/lesson-materials.test.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-fix-evidence
          path: qa-reports/
          retention-days: 7
