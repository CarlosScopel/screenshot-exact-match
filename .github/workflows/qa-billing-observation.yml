name: QA private billing observations
on:
  push:
    branches: [qa/private-billing-observation-20261115]
    paths: [.github/workflows/qa-billing-observation.yml]
permissions:
  contents: write
jobs:
  observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qa_disposable_only
          POSTGRES_DB: ordem_billing_qa
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: qa_disposable_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply inspected patch and verify its checksum
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          data=pathlib.Path('qa/billing-observation.patch.b64').read_text().replace('fLaX5rLXlaw','fLaXVrLXlaw')
          patch=gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest()=='fc2febc5d9c378b7c4d53a790ddeb72da8150c94916d3e21efb4b67d3ebbb2b9'
          pathlib.Path('/tmp/billing-observation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/billing-observation.patch
          git apply /tmp/billing-observation.patch
          bun install --frozen-lockfile
          bunx --no-install prettier --write src/components/portal/BillingObservation.tsx src/components/portal/MentorshipPanel.tsx src/lib/billing-observation.ts src/test/billing-observation-api.test.ts src/test/billing-observation.test.tsx src/test/mentorship-ui.test.tsx
      - name: TypeScript
        run: bunx --no-install tsc --noEmit 2>&1 | tee evidence/typescript.log
      - name: All unit and component tests
        run: bun run test --reporter=default --reporter=json --outputFile=evidence/vitest.json 2>&1 | tee evidence/tests.log
      - name: Scoped lint
        run: bunx --no-install eslint src/components/portal/BillingObservation.tsx src/components/portal/MentorshipPanel.tsx src/lib/billing-observation.ts src/test/billing-observation-api.test.ts src/test/billing-observation.test.tsx src/test/mentorship-ui.test.tsx 2>&1 | tee evidence/lint.log
      - name: Existing finance and new privacy SQL on disposable database only
        run: |
          psql -h 127.0.0.1 -U postgres -d ordem_billing_qa -v ON_ERROR_STOP=1 -f scripts/validate-mentorship.sql > evidence/sql-finance.log
          psql -h 127.0.0.1 -U postgres -d ordem_billing_qa -v ON_ERROR_STOP=1 -f scripts/validate-billing-observations.sql > evidence/sql-observations.log
      - name: Production build
        run: bun run build 2>&1 | tee evidence/build.log
      - name: Isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/qa-browser" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/qa-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile private note workflows
        run: PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qa-browser/node_modules/playwright/index.mjs" node qa/validate-billing-observation.mjs
      - name: Preserve only verified source on QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/portal/BillingObservation.tsx src/components/portal/MentorshipPanel.tsx src/lib/billing-observation.ts src/test/billing-observation-api.test.ts src/test/billing-observation.test.tsx src/test/mentorship-ui.test.tsx scripts/setup-billing-observations.sql scripts/validate-billing-observations.sql
          git diff --cached --check
          git diff --cached --stat > evidence/changes.txt
          git commit -m 'test: preservar observacoes privadas verificadas'
          git push origin HEAD:qa/private-billing-observation-20261115
          git rev-parse HEAD > evidence/verified-commit.txt
          git ls-tree -r HEAD -- src/components/portal/BillingObservation.tsx src/components/portal/MentorshipPanel.tsx src/lib/billing-observation.ts src/test/billing-observation-api.test.ts src/test/billing-observation.test.tsx src/test/mentorship-ui.test.tsx scripts/setup-billing-observations.sql scripts/validate-billing-observations.sql > evidence/verified-blobs.txt
      - name: Source evidence without secrets
        if: always()
        run: |
          git diff -- src scripts > evidence/source.diff
          tar -czf evidence/changed-source.tar.gz src/components/portal/BillingObservation.tsx src/components/portal/MentorshipPanel.tsx src/lib/billing-observation.ts src/test/billing-observation-api.test.ts src/test/billing-observation.test.tsx src/test/mentorship-ui.test.tsx scripts/setup-billing-observations.sql scripts/validate-billing-observations.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-billing-observation-evidence
          path: evidence/
          retention-days: 7
