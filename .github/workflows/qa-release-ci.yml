name: QA release CI repair
on:
  push:
    branches: [qa/release-ci-20261114]
    paths: [.github/workflows/qa-release-ci.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Repair only obsolete browser check and reported formatting
        run: |
          mkdir -p qa-reports
          cp qa/public-browser.mjs scripts/validate-browser.mjs
          bunx --no-install prettier --write scripts/validate-browser.mjs src/components/portal/AccessScreen.tsx src/components/portal/AdminPage.tsx src/lib/password-recovery.ts src/lib/platform-settings.ts src/routes/__root.tsx src/routes/reset-password.tsx src/test/access-login.test.tsx src/test/password-recovery.test.tsx src/test/platform-settings.test.ts
          git diff --stat > qa-reports/diff-stat.txt
          git diff -- src scripts > qa-reports/change.diff
      - name: TypeScript
        run: bunx --no-install tsc --noEmit 2>&1 | tee qa-reports/typescript.log
      - name: All unit tests
        run: bun run test --reporter=default --reporter=json --outputFile=qa-reports/vitest.json
      - name: Full application lint
        run: bunx --no-install eslint . --ignore-pattern 'qa/**' --ignore-pattern 'qa-reports/**' --format json --output-file qa-reports/lint.json
      - name: Production build
        run: bun run build 2>&1 | tee qa-reports/build.log
      - name: Isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/qa-ci-browser" --no-save --package-lock=false playwright wrangler
          node "$RUNNER_TEMP/qa-ci-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Public flows on actual Cloudflare production build
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --env-file=.env --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".output/server/.dev.vars",`SUPABASE_URL=${JSON.stringify(process.env.VITE_SUPABASE_URL)}\nSUPABASE_PUBLISHABLE_KEY=${JSON.stringify(process.env.VITE_SUPABASE_PUBLISHABLE_KEY)}\n`);'
          node "$RUNNER_TEMP/qa-ci-browser/node_modules/wrangler/bin/wrangler.js" dev --config .output/server/wrangler.json --local --ip 127.0.0.1 --port 4173 > qa-reports/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qa-ci-browser/node_modules/playwright/index.mjs" node --env-file=.env scripts/validate-browser.mjs
      - name: Preserve exactly tested application files on QA branch only
        run: |
          git add scripts/validate-browser.mjs src/components/portal/AccessScreen.tsx src/components/portal/AdminPage.tsx src/lib/password-recovery.ts src/lib/platform-settings.ts src/routes/__root.tsx src/routes/reset-password.tsx src/test/access-login.test.tsx src/test/password-recovery.test.tsx src/test/platform-settings.test.ts
          git -c user.name='QA validation' -c user.email='qa@users.noreply.github.com' commit -m 'test: preserve verified CI repair application files'
          git push origin HEAD:qa/release-ci-20261114
          git rev-parse HEAD > qa-reports/tested-sha.txt
          git ls-tree -r HEAD scripts/validate-browser.mjs src/components/portal/AccessScreen.tsx src/components/portal/AdminPage.tsx src/lib/password-recovery.ts src/lib/platform-settings.ts src/routes/__root.tsx src/routes/reset-password.tsx src/test/access-login.test.tsx src/test/password-recovery.test.tsx src/test/platform-settings.test.ts > qa-reports/verified-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ci-evidence
          path: qa-reports/
          retention-days: 7
